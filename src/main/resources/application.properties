spring.application.name=two_token_security

server.port=11111

spring.config.import=optional:file:.env[.properties]

allowed.frontend.url=http://${HOST_SERVER_IP}:12345

app.secret.key=${APP_SECRET_KEY}

# 15 minute
access.token.expiration=${ACCESS_TOKEN_EXPIRATION}

# 30 days
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION}